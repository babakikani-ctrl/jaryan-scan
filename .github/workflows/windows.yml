name: build-windows

on:
  push:
  workflow_dispatch:

# Build a self-contained Windows .exe using the openFrameworks Visual Studio release.
# The VS release ships a PRECOMPILED oF core (no recompile -> immune to the toolchain
# version drift that breaks the msys2 build) and BUNDLES all libraries (glm, FreeImage,
# OpenCV), so there is no package-manager version chase.

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # allow updating the download Release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: proj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download openFrameworks (VS release)
        run: |
          Write-Host "downloading oF 0.12.0 vs release (~674MB)..."
          curl.exe -L --retry 3 -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_vs_release.zip
          Write-Host "extracting..."
          tar -xf of.zip
          Rename-Item of_v0.12.0_vs_release OF
          Get-ChildItem OF | Select-Object Name | Format-Table -AutoSize

      - name: Diagnose OpenCV video capabilities (for RTSP)
        run: |
          Write-Host "=== ofxOpenCv opencv libs (looking for videoio) ==="
          Get-ChildItem -Path OF\addons\ofxOpenCv\libs\opencv\lib -Recurse -Filter *.lib -EA SilentlyContinue | ForEach-Object { $_.Name }
          Write-Host "=== any ffmpeg / videoio anywhere in ofxOpenCv ==="
          Get-ChildItem -Path OF\addons\ofxOpenCv -Recurse -EA SilentlyContinue | Where-Object { $_.Name -match 'videoio|ffmpeg' } | ForEach-Object { $_.FullName }
          Write-Host "=== videoio header present? ==="
          Get-ChildItem -Path OF\addons\ofxOpenCv -Recurse -Filter videoio.hpp -EA SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Stage project into oF
        run: |
          $app = "OF\apps\myApps\dataJaryanScan"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item proj\src        $app -Recurse -Force
          Copy-Item proj\bin        $app -Recurse -Force
          Copy-Item proj\addons.make $app -Force
          # DNN person-detection ENABLED (ofxOpenCv-vs ships opencv_dnn, same as macOS) — it is the
          # most important feature; the app must behave identically to the mac build.
          Get-ChildItem $app | Select-Object Name | Format-Table -AutoSize

      - name: Generate Visual Studio project
        run: |
          $of   = (Resolve-Path "OF").Path
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          Write-Host "--- all projectGenerator*.exe in the release ---"
          Get-ChildItem -Path $of -Recurse -Filter projectGenerator*.exe -EA SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          # prefer a nested NATIVE command-line binary (resources/app/app) over the top-level Electron shell
          $pg = Get-ChildItem -Path $of -Recurse -Filter projectGenerator.exe -EA SilentlyContinue |
                Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1
          if (-not $pg) { Write-Error "projectGenerator not found"; exit 1 }
          Write-Host "using: $($pg.FullName)"
          # launch, then POLL for the .sln (the Electron shell returns before generation finishes)
          $p = Start-Process -FilePath $pg.FullName -ArgumentList @("-o$of","-pvs","$proj") -PassThru -NoNewWindow
          $sln = $null
          for ($i=0; $i -lt 50; $i++) {
            Start-Sleep -Seconds 3
            $sln = Get-ChildItem -Path $proj -Filter *.sln -EA SilentlyContinue | Select-Object -First 1
            if ($sln) { break }
          }
          if ($p -and -not $p.HasExited) { $p | Stop-Process -Force -EA SilentlyContinue }
          Write-Host "--- project dir after generation ---"
          Get-ChildItem $proj | Select-Object Name | Format-Table -AutoSize
          if (-not $sln) { Write-Error "no .sln generated after wait"; exit 1 }
          Write-Host "generated: $($sln.FullName)"

      - name: Build (Release x64)
        run: |
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          $sln  = (Get-ChildItem -Path $proj -Filter *.sln | Select-Object -First 1).FullName
          Write-Host "building $sln"
          msbuild $sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal /nologo
          Write-Host "--- bin ---"
          Get-ChildItem "$proj\bin" | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dataJaryanScan-windows
          path: OF/apps/myApps/dataJaryanScan/bin
          if-no-files-found: error

      - name: Publish to Release (v1 — always latest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          Compress-Archive -Path "$proj\bin\*" -DestinationPath "dataJaryanScan-windows.zip" -Force
          gh release upload v1 "dataJaryanScan-windows.zip" --clobber -R $env:GITHUB_REPOSITORY
