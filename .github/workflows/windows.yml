name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PKG_CONFIG_PATH: /mingw64/lib/pkgconfig:/mingw64/share/pkgconfig
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: proj

      - name: Setup MSYS2 (MINGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            unzip
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf

      - name: Download openFrameworks (msys2 release)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          echo "workspace: $(pwd)"
          curl -L --retry 3 -o of.zip \
            https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_msys2_mingw64_release.zip
          echo "unzipping..."
          unzip -q of.zip
          mv of_v0.12.0_msys2_mingw64_release OF
          echo "=== OF top ==="; ls OF

      - name: Install oF dependencies (explicit — fixes the broken FreeImage name)
        run: |
          set -e
          P=mingw-w64-x86_64
          # msys packages
          pacman -S --needed --noconfirm rsync zip wget || true
          # mingw packages (correct lowercase names; oF's own script uses "FreeImage" which no longer resolves)
          PKGS="assimp boost cairo curl freeglut freeimage glew glfw glm harfbuzz \
                libsndfile libusb libxml2 mpg123 nlohmann-json ntldd-git openal opencv \
                pkgconf poco pugixml rtaudio uriparser utf8cpp zlib"
          for pkg in $PKGS; do
            echo "::group::install $pkg"
            pacman -S --needed --noconfirm "$P-$pkg" || echo "WARN: $pkg failed"
            echo "::endgroup::"
          done
          # ---- diagnostics ----
          echo "which pkg-config: $(command -v pkg-config)"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "pc files (glm/opencv):"; ls /mingw64/lib/pkgconfig/ 2>/dev/null | grep -iE 'glm|opencv' || echo "  (none listed)"
          # ---- glm.pc fallback: the msys2 glm package is header-only and ships NO glm.pc ----
          if ! pkg-config glm --exists 2>/dev/null; then
            echo "glm.pc missing -> creating one"
            cat > /mingw64/lib/pkgconfig/glm.pc <<'EOF'
prefix=/mingw64
includedir=${prefix}/include
Name: GLM
Description: OpenGL Mathematics (header-only)
Version: 0.9.9.8
Cflags: -I${includedir}
EOF
          fi
          pkg-config glm --exists && echo "glm OK" || echo "glm STILL MISSING"
          # ---- point ofxOpenCv at OpenCV4 (includes the dnn module) ----
          ACFG="$GITHUB_WORKSPACE/OF/addons/ofxOpenCv/addon_config.mk"
          if pkg-config opencv4 --exists; then
            echo "OpenCV4 found -> ofxOpenCv will use opencv4 (dnn available)"
            sed -i -E 's/ADDON_PKG_CONFIG_LIBRARIES =(.*)opencv\s/ADDON_PKG_CONFIG_LIBRARIES =\1opencv4 /g' "$ACFG" || true
            sed -i -E 's/ADDON_PKG_CONFIG_LIBRARIES =(.*)opencv$/ADDON_PKG_CONFIG_LIBRARIES =\1opencv4/g' "$ACFG" || true
          else
            echo "opencv4 pkg-config NOT found"
          fi
          echo "=== opencv4 dnn lib? ==="; pkg-config opencv4 --libs 2>/dev/null | tr ' ' '\n' | grep -i dnn || echo "(no dnn in libs list)"

      - name: Stage project into oF
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          APP=OF/apps/myApps/dataJaryanScan
          rm -rf "$APP"; mkdir -p "$APP"
          cp -r proj/src "$APP/"
          cp -r proj/bin "$APP/"
          cp proj/addons.make "$APP/"
          # grab a working Makefile + config.make from any example template
          TPLDIR=$(dirname "$(find OF/examples -name config.make 2>/dev/null | head -1)")
          echo "template dir: $TPLDIR"
          cp "$TPLDIR/Makefile" "$APP/Makefile"
          cp "$TPLDIR/config.make" "$APP/config.make"
          echo "=== staged app ==="; ls -la "$APP"

      - name: Build (Release)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OF/apps/myApps/dataJaryanScan"
          make -j2 Release
          echo "=== bin after build ==="; ls -la bin

      - name: Bundle runtime DLLs (make it self-contained)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/OF/apps/myApps/dataJaryanScan/bin"
          EXE=$(ls *.exe 2>/dev/null | head -1)
          echo "exe: $EXE"
          if [ -n "$EXE" ]; then
            # copy every non-system DLL the exe transitively depends on
            ldd "$EXE" | awk '{print $3}' | while read -r dll; do
              case "$dll" in
                /c/Windows/*|/c/WINDOWS/*|"") continue ;;
              esac
              if [ -f "$dll" ]; then cp -u "$dll" . && echo "  + $(basename "$dll")"; fi
            done
          fi
          echo "=== final bin ==="; ls -la

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dataJaryanScan-windows
          path: OF/apps/myApps/dataJaryanScan/bin
          if-no-files-found: error
