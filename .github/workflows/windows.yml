name: build-windows

on:
  push:
  workflow_dispatch:

# Build a self-contained Windows .exe using the openFrameworks Visual Studio release.
# The VS release ships a PRECOMPILED oF core (no recompile -> immune to the toolchain
# version drift that breaks the msys2 build) and BUNDLES all libraries (glm, FreeImage,
# OpenCV), so there is no package-manager version chase.

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: proj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download openFrameworks (VS release)
        run: |
          Write-Host "downloading oF 0.12.0 vs release (~674MB)..."
          curl.exe -L --retry 3 -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_vs_release.zip
          Write-Host "extracting..."
          tar -xf of.zip
          Rename-Item of_v0.12.0_vs_release OF
          Get-ChildItem OF | Select-Object Name | Format-Table -AutoSize

      - name: Stage project into oF
        run: |
          $app = "OF\apps\myApps\dataJaryanScan"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item proj\src        $app -Recurse -Force
          Copy-Item proj\bin        $app -Recurse -Force
          Copy-Item proj\addons.make $app -Force
          # First build disables opencv_dnn so it compiles even if ofxOpenCv-vs lacks the dnn lib.
          # (blob-tracking fallback still works). Directory.Build.props injects the define app-wide.
          $props = '<Project><ItemDefinitionGroup><ClCompile><PreprocessorDefinitions>JARYAN_NO_DNN;%(PreprocessorDefinitions)</PreprocessorDefinitions></ClCompile></ItemDefinitionGroup></Project>'
          Set-Content -Path "$app\Directory.Build.props" -Value $props -Encoding ascii
          Get-ChildItem $app | Select-Object Name | Format-Table -AutoSize

      - name: Generate Visual Studio project
        run: |
          $of   = (Resolve-Path "OF").Path
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          Write-Host "--- OF top level ---"; Get-ChildItem $of | Select-Object Name | Format-Table -AutoSize
          # locate projectGenerator.exe wherever it ships in this release
          $pg = Get-ChildItem -Path $of -Recurse -Filter projectGenerator.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pg) {
            Write-Host "projectGenerator.exe not found; searching for commandLine variant..."
            $pg = Get-ChildItem -Path $of -Recurse -Filter projectGeneratorCommandLine.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $pg) { Write-Error "projectGenerator not found in the oF release"; exit 1 }
          Write-Host "found projectGenerator: $($pg.FullName)"
          & $pg.FullName "-o$of" "-pvs" "-aofxOpenCv, ofxGui" "$proj"
          Write-Host "--- project dir after generation ---"
          Get-ChildItem $proj | Select-Object Name | Format-Table -AutoSize
          $sln = Get-ChildItem -Path $proj -Filter *.sln | Select-Object -First 1
          if (-not $sln) { Write-Error "no .sln generated"; exit 1 }
          Write-Host "sln: $($sln.FullName)"

      - name: Build (Release x64)
        run: |
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          $sln  = (Get-ChildItem -Path $proj -Filter *.sln | Select-Object -First 1).FullName
          Write-Host "building $sln"
          msbuild $sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal /nologo
          Write-Host "--- bin ---"
          Get-ChildItem "$proj\bin" | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dataJaryanScan-windows
          path: OF/apps/myApps/dataJaryanScan/bin
          if-no-files-found: error
