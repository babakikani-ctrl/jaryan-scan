name: build-windows

on:
  push:
  workflow_dispatch:

# Build a self-contained Windows .exe using the openFrameworks Visual Studio release.
# The VS release ships a PRECOMPILED oF core (no recompile -> immune to the toolchain
# version drift that breaks the msys2 build) and BUNDLES all libraries (glm, FreeImage,
# OpenCV), so there is no package-manager version chase.

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # allow updating the download Release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: proj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Download openFrameworks (VS release)
        run: |
          Write-Host "downloading oF 0.12.0 vs release (~674MB)..."
          curl.exe -L --retry 3 -o of.zip https://github.com/openframeworks/openFrameworks/releases/download/0.12.0/of_v0.12.0_vs_release.zip
          Write-Host "extracting..."
          tar -xf of.zip
          Rename-Item of_v0.12.0_vs_release OF
          Get-ChildItem OF | Select-Object Name | Format-Table -AutoSize

      - name: Diagnose OpenCV video capabilities (for RTSP)
        run: |
          Write-Host "=== ofxOpenCv opencv libs (looking for videoio) ==="
          Get-ChildItem -Path OF\addons\ofxOpenCv\libs\opencv\lib -Recurse -Filter *.lib -EA SilentlyContinue | ForEach-Object { $_.Name }
          Write-Host "=== any ffmpeg / videoio anywhere in ofxOpenCv ==="
          Get-ChildItem -Path OF\addons\ofxOpenCv -Recurse -EA SilentlyContinue | Where-Object { $_.Name -match 'videoio|ffmpeg' } | ForEach-Object { $_.FullName }
          Write-Host "=== videoio header present? ==="
          Get-ChildItem -Path OF\addons\ofxOpenCv -Recurse -Filter videoio.hpp -EA SilentlyContinue | ForEach-Object { $_.FullName }

      - name: Stage project into oF
        run: |
          $app = "OF\apps\myApps\dataJaryanScan"
          New-Item -ItemType Directory -Force -Path $app | Out-Null
          Copy-Item proj\src        $app -Recurse -Force
          Copy-Item proj\bin        $app -Recurse -Force
          Copy-Item proj\addons.make $app -Force
          # DNN person-detection ENABLED + RTSP (JARYAN_RTSP) + NDI input (JARYAN_NDI): link opencv_videoio.
          $props = '<Project><ItemDefinitionGroup><ClCompile><PreprocessorDefinitions>JARYAN_RTSP;JARYAN_NDI;%(PreprocessorDefinitions)</PreprocessorDefinitions></ClCompile><Link><AdditionalDependencies>opencv_videoio460.lib;%(AdditionalDependencies)</AdditionalDependencies></Link></ItemDefinitionGroup></Project>'
          Set-Content -Path "$app\Directory.Build.props" -Value $props -Encoding ascii
          Get-ChildItem $app | Select-Object Name | Format-Table -AutoSize

      - name: NDI input support (ofxNDI — take video FROM TouchDesigner as a source)
        run: |
          $app = "OF\apps\myApps\dataJaryanScan"
          # ofxNDI is self-contained: bundles the NDI headers + the x64 runtime DLL, and loads the DLL
          # dynamically (no import .lib, no SDK install needed). Just clone it and add it as an addon.
          git clone --depth 1 https://github.com/leadedge/ofxNDI.git OF\addons\ofxNDI 2>&1 | Out-Null
          if (Test-Path "OF\addons\ofxNDI\src\ofxNDI.h") {
            Add-Content -Path "$app\addons.make" -Value "ofxNDI"
            # bundle the NDI runtime DLL next to the exe so it runs even without NDI Tools installed
            $dll = "OF\addons\ofxNDI\libs\NDI\bin\vs\Processing.NDI.Lib.x64.dll"
            if (Test-Path $dll) { Copy-Item $dll "$app\bin\" -Force; Write-Host "bundled Processing.NDI.Lib.x64.dll" }
            Write-Host "ofxNDI added. addons.make:"; Get-Content "$app\addons.make"
          } else {
            Write-Host "ofxNDI clone failed -> NDI define is set but addon missing (build may fail); check network"
          }

      - name: Kinect v2 support (optional — Kinect SDK 2.0 + ofxKinectForWindows2)
        continue-on-error: true
        timeout-minutes: 16
        run: |
          $app = "OF\apps\myApps\dataJaryanScan"
          $ErrorActionPreference = "Continue"
          # helper: are the SDK dev files present yet? (needs BOTH the header and the x64 import lib)
          function Find-Kinect {
            $h = @(Get-ChildItem "C:\ksdk","C:\Program Files\Microsoft SDKs\Kinect" -Recurse -Filter Kinect.h -EA SilentlyContinue) | Select-Object -First 1
            $l = @(Get-ChildItem "C:\ksdk","C:\Program Files\Microsoft SDKs\Kinect" -Recurse -Filter Kinect20.lib -EA SilentlyContinue | Where-Object { $_.FullName -match 'x64' }) | Select-Object -First 1
            if ($h -and $l) { return @($h,$l) } else { return $null }
          }
          Write-Host "downloading Kinect SDK 2.0..."
          try {
            # bounded download so a slow mirror can't eat the whole budget
            curl.exe -L --retry 2 --max-time 300 -o kinect.exe "https://download.microsoft.com/download/F/2/D/F2D1012E-3BC6-49C5-B8B3-5ACFF58AF7B8/KinectSDK-v2.0_1409-Setup.exe"
            Write-Host ("downloaded: " + (Get-Item kinect.exe).Length + " bytes")
            # STEP 1: extract the WiX bundle payloads WITHOUT installing (no driver, no hang) via /layout
            $lp = Start-Process -FilePath ".\kinect.exe" -ArgumentList "/layout","C:\klayout","/quiet" -PassThru
            if (-not $lp.WaitForExit(150000)) { Write-Host "layout timed out -> killing"; try { $lp.Kill() } catch {} }
          } catch { Write-Host "kinect sdk download/layout failed: $_" }
          Write-Host "MSIs found in layout:"
          # order: SDK/dev MSIs FIRST (they hold Kinect.h + Kinect20.lib), driver/runtime LAST (slow, unneeded).
          # combined with break-early below, we grab the headers fast and never touch the driver installer.
          $msis = @(Get-ChildItem C:\klayout -Recurse -Filter *.msi -EA SilentlyContinue |
                    Sort-Object @{Expression={ if ($_.Name -match 'SDK') {0} elseif ($_.Name -match 'Runtime|Driver|Speech|Face|Fusion') {3} else {1} }}, @{Expression={$_.Length}; Descending=$true})
          $msis | ForEach-Object { Write-Host ("  " + $_.Name + "  (" + [int]($_.Length/1MB) + " MB)") }
          # STEP 2: admin-install each MSI (files-only extraction, no drivers). CHECK AFTER EACH and stop the
          # instant the dev files appear -> we never touch the slow driver/runtime MSIs once we have what we need.
          $found = $null
          foreach ($m in $msis) {
            Write-Host ("admin-installing " + $m.Name + " ...")
            $mp = Start-Process msiexec -ArgumentList @("/a","`"$($m.FullName)`"","/qn","TARGETDIR=C:\ksdk") -PassThru
            if (-not $mp.WaitForExit(90000)) { Write-Host "  (this MSI is slow -> killing, moving on)"; try { $mp.Kill() } catch {} }
            $found = Find-Kinect
            if ($found) { Write-Host "  -> SDK dev files now present, stopping extraction early"; break }
          }
          # STEP 3: enable Kinect if the header + x64 lib are present
          if (-not $found) { $found = Find-Kinect }
          if ($found) {
            $kh = $found[0]; $klib = $found[1]
            Write-Host ("found Kinect.h  -> " + $kh.FullName)
            Write-Host ("found Kinect20.lib -> " + $klib.FullName)
            # KINECTSDK20_DIR is the folder whose child is inc\Kinect.h  (parent of the 'inc' dir), trailing slash
            $kdir = (Split-Path (Split-Path $kh.FullName -Parent) -Parent) + "\"
            Write-Host "Kinect SDK present -> ENABLING Kinect v2.  KINECTSDK20_DIR=$kdir"
            "KINECTSDK20_DIR=$kdir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
            git clone --depth 1 https://github.com/elliotwoods/ofxKinectForWindows2.git OF\addons\ofxKinectForWindows2 2>&1 | Out-Null
            Add-Content -Path "$app\addons.make" -Value "ofxKinectForWindows2"
            # rewrite the props to also define JARYAN_KINECT
            $props = '<Project><ItemDefinitionGroup><ClCompile><PreprocessorDefinitions>JARYAN_RTSP;JARYAN_NDI;JARYAN_KINECT;%(PreprocessorDefinitions)</PreprocessorDefinitions></ClCompile><Link><AdditionalDependencies>opencv_videoio460.lib;%(AdditionalDependencies)</AdditionalDependencies></Link></ItemDefinitionGroup></Project>'
            Set-Content -Path "$app\Directory.Build.props" -Value $props -Encoding ascii
            Write-Host "addons.make now:"; Get-Content "$app\addons.make"
          } else {
            Write-Host "Kinect SDK dev files NOT found -> building WITHOUT Kinect (RTSP/webcam still work)"
          }

      - name: Generate Visual Studio project
        run: |
          $of   = (Resolve-Path "OF").Path
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          Write-Host "--- all projectGenerator*.exe in the release ---"
          Get-ChildItem -Path $of -Recurse -Filter projectGenerator*.exe -EA SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          # prefer a nested NATIVE command-line binary (resources/app/app) over the top-level Electron shell
          $pg = Get-ChildItem -Path $of -Recurse -Filter projectGenerator.exe -EA SilentlyContinue |
                Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1
          if (-not $pg) { Write-Error "projectGenerator not found"; exit 1 }
          Write-Host "using: $($pg.FullName)"
          # launch, then POLL for the .sln (the Electron shell returns before generation finishes)
          $p = Start-Process -FilePath $pg.FullName -ArgumentList @("-o$of","-pvs","$proj") -PassThru -NoNewWindow
          $sln = $null
          for ($i=0; $i -lt 50; $i++) {
            Start-Sleep -Seconds 3
            $sln = Get-ChildItem -Path $proj -Filter *.sln -EA SilentlyContinue | Select-Object -First 1
            if ($sln) { break }
          }
          if ($p -and -not $p.HasExited) { $p | Stop-Process -Force -EA SilentlyContinue }
          Write-Host "--- project dir after generation ---"
          Get-ChildItem $proj | Select-Object Name | Format-Table -AutoSize
          if (-not $sln) { Write-Error "no .sln generated after wait"; exit 1 }
          Write-Host "generated: $($sln.FullName)"

      - name: Build (Release x64)
        run: |
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          $sln  = (Get-ChildItem -Path $proj -Filter *.sln | Select-Object -First 1).FullName
          Write-Host "building $sln"
          msbuild $sln /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal /nologo
          Write-Host "--- bin ---"
          Get-ChildItem "$proj\bin" | Select-Object Name,Length | Format-Table -AutoSize

      - name: Bundle OpenCV FFmpeg backend (RTSP) + verify all DLLs
        run: |
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          Write-Host "downloading opencv 4.6.0 (for the ffmpeg videoio backend dll)..."
          curl.exe -L --retry 3 -o ocv.exe https://github.com/opencv/opencv/releases/download/4.6.0/opencv-4.6.0-vc14_vc15.exe
          7z x ocv.exe -oocvx -y -r "opencv_videoio_ffmpeg460_64.dll" | Out-Null
          $dll = Get-ChildItem -Path ocvx -Recurse -Filter opencv_videoio_ffmpeg460_64.dll -EA SilentlyContinue | Select-Object -First 1
          if (-not $dll) { Write-Error "opencv_videoio_ffmpeg460_64.dll not found in opencv release"; exit 1 }
          Copy-Item $dll.FullName "$proj\bin\" -Force
          Write-Host "bundled ffmpeg backend: $($dll.Name)  ($([math]::Round($dll.Length/1MB,1)) MB)"
          Write-Host "--- final bin dlls ---"
          Get-ChildItem "$proj\bin" -Filter *.dll | Select-Object Name | Format-Table -AutoSize

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dataJaryanScan-windows
          path: OF/apps/myApps/dataJaryanScan/bin
          if-no-files-found: error

      - name: Publish to Release (v1 — always latest)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $proj = (Resolve-Path "OF\apps\myApps\dataJaryanScan").Path
          Compress-Archive -Path "$proj\bin\*" -DestinationPath "dataJaryanScan-windows.zip" -Force
          gh release upload v1 "dataJaryanScan-windows.zip" --clobber -R $env:GITHUB_REPOSITORY
